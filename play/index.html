<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4e8cc">
  <title>Tayara El Hara | طيارة الحارة</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <link rel="apple-touch-icon" href="TemplateData/icon-192.png">
  <style>
    @font-face { font-family: Lalezar; src: url("TemplateData/Lalezar.ttf") format("truetype"); font-display: swap; }
    :root { --ink: #1d1612; --paper: #f4e8cc; --gold: #f2b531; --gold-dark: #c48a14; --red: #d63a2f; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: Lalezar, system-ui, sans-serif; color: var(--ink); }

    #stage { position: relative; height: 100vh; height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; background: #2a211a; box-shadow: 0 0 0 4px var(--ink), 0 12px 40px rgba(29, 22, 18, .35); }
    #stage:fullscreen { box-shadow: none; }
    @media (max-width: 700px), (pointer: coarse) {
      #stage { width: 100vw; height: 100vh; height: 100dvh; max-width: none; aspect-ratio: auto; box-shadow: none; }
    }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #2a211a; outline: none; }

    #loading { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; background: var(--paper); transition: opacity .35s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #logo { width: min(80%, 420px); height: auto; }
    #bar { width: min(78%, 360px); height: 28px; border: 5px solid var(--ink); border-radius: 18px; background: #fffaf0; overflow: hidden; }
    #fill { width: 0; height: 100%; background: var(--gold); border-right: 3px solid var(--gold-dark); transition: width .15s linear; }
    #msg { font-size: 26px; letter-spacing: .5px; }
    #err { display: none; max-width: 80%; text-align: center; font: 16px/1.4 system-ui, sans-serif; color: var(--red); }

    #fs { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 6; width: 42px; height: 42px; padding: 0; border: 4px solid var(--ink); border-radius: 50%; background: var(--gold); cursor: pointer; display: none; }
    #fs:active { transform: scale(.94); }
    #fs svg { width: 100%; height: 100%; display: block; }

    #rotate { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--paper); text-align: center; font-size: 26px; }
    #rotate .phone { width: 46px; height: 80px; border: 5px solid var(--ink); border-radius: 12px; background: var(--gold); animation: turn 1.6s ease-in-out infinite; }
    #rotate small { font: 600 15px system-ui, sans-serif; opacity: .75; }
    @keyframes turn { 0%, 30% { transform: rotate(-90deg); } 70%, 100% { transform: rotate(0deg); } }
    @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) { #rotate { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } #fill, #loading { transition: none; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img id="logo" src="TemplateData/logo.png" alt="Tayara El Hara">
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">جاري التحميل…</div>
      <div id="err"></div>
    </div>
    <button id="fs" type="button" aria-label="Fullscreen / ملء الشاشة" title="Fullscreen / ملء الشاشة">
      <svg viewBox="0 0 40 40" fill="none" stroke="#1d1612" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9H9v4M27 9h4v4M13 31H9v-4M27 31h4v-4"/></svg>
    </button>
  </div>
  <div id="rotate"><div class="phone"></div><div>لفّ تليفونك طولي</div><small>Rotate your phone to portrait</small></div>

  <script src="Build/web.loader.js"></script>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var canvas = document.getElementById("canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var fsBtn = document.getElementById("fs");
      var err = document.getElementById("err");
      var build = "Build";
      var config = {
        arguments: [],
        dataUrl: build + "/web.data.unityweb",
        frameworkUrl: build + "/web.framework.js.unityweb",
        codeUrl: build + "/web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Tayara El Hara",
        productName: "Tayara El Hara",
        productVersion: "0.4.0",
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      function sizeCanvas() {
        var r = stage.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(r.width * config.devicePixelRatio));
        canvas.height = Math.max(1, Math.round(r.height * config.devicePixelRatio));
      }
      sizeCanvas();

      var fsEl = stage.requestFullscreen ? stage : (stage.webkitRequestFullscreen ? stage : null);
      if (fsEl && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.style.display = "block";
      fsBtn.addEventListener("click", function () {
        var on = document.fullscreenElement || document.webkitFullscreenElement;
        if (on) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
        var p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
        var lock = function () { try { screen.orientation.lock("portrait").catch(function () {}); } catch (e) {} };
        if (p && p.then) p.then(lock, function () {}); else lock();
      });

      function fail(message) {
        document.getElementById("msg").style.display = "none";
        err.style.display = "block";
        err.textContent = message;
      }

      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.classList.add("done");
        setTimeout(function () { loading.style.display = "none"; }, 400);
        canvas.focus();
      }).catch(function (e) {
        fail(String(e && e.message ? e.message : e));
      });
    })();
  </script>
</body>
</html>
